# Level 1 of docs/evals.md: every check that needs no model and no key, on every push and pull request.
name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ripgrep jq
      - run: pnpm install --frozen-lockfile
      - run: pnpm doctor || true
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm test:mutants
